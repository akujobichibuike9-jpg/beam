<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF5FC">
<meta name="description" content="Send files between your phone and laptop with a short code.">
<title>lazrr</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="lazrr">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>(function(){try{var t=localStorage.getItem('beam_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div>
    <div class="icon">
      <svg width="82" height="82" viewBox="0 0 100 100">
        <path class="arc" d="M22 76 C 26 42, 54 26, 72 30" fill="none" stroke="#9CCBF5" stroke-width="9" stroke-linecap="round"></path>
        <g class="box"><rect x="62" y="14" width="26" height="26" rx="7" fill="#FFFFFF" transform="rotate(14 75 27)"></rect></g>
      </svg>
    </div>
    <div class="word">lazrr</div>
  </div>
</div>

<div class="wall" id="wall" aria-hidden="true" hidden></div>
<main class="app" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>

<aside class="aside-panel" id="aside" aria-label="Chat info" hidden></aside>
<div class="composer" id="composer" hidden></div>
<section class="call" id="call" hidden aria-label="Call"></section>
<button class="callpill lg dark" id="callpill" hidden data-act="call-open"></button>

<input type="file" id="picker" multiple hidden>
<dialog class="sheet" id="sheet"></dialog>
<dialog class="sheet" id="info" aria-label="Room info"></dialog>

<noscript><p style="padding:24px">lazrr needs JavaScript to send files.</p></noscript>
<script src="/vendor/qrcode.js"></script>
<script src="/walls.js"></script>
<script src="/e2e.js"></script>
<script src="/app.js"></script>
</body>
</html>
